<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Local storage Hw</title>
</head>
<body>
    <h1>My Personal Notes</h1>
    <form>
        <input id="title" placeholder="Enter note title"></input>
        <textarea id="note" name="note" placeholder="Write your note" rows="4" cols="50"></textarea>
    </form>
    <button id="save">Save Note</button>
    <button id="display">Display Note</button>
    <button id="clear">Clear Note</button>
    <script src="script.js"></script>
</body>
</html>
